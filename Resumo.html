<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Resumo - Let's Party</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Cabeçalho -->
<header>
	<nav>
		<div class="organizar_navbar">
			<a href="index.html">
				<img src="img/logo.jpg" class="logo" alt="Let's Party">
			</a>
			<span class="texto_preto_negrito">Let’s Party</span>
			<img src="img/config.png" class="img_config" alt="Configurações">
		</div>
	</nav>
</header>


<div style="padding: 34px 124px 24px 124px; gap:32px;">
	<!-- Barra de Progresso -->
	<div class="container_caminho">
		<div class="caminho_inativo">
			<span class="texto_caminho_inativo">1. Local</span>
		</div>
		<img src="img/seta.png" class="seta_img" alt="Seta">
		<div class="caminho_inativo">
			<span class="texto_caminho_inativo">2. Configurar Festa</span>
		</div>
		<img src="img/seta.png" class="seta_img" alt="Seta">
		<div class="caminho_ativo">
			<span class="textos_brancos">3. Resumo</span>
		</div>
		<img src="img/seta.png" class="seta_img" alt="Seta">
		<div class="caminho_inativo">
			<span class="texto_caminho_inativo">4. Confirmação</span>
		</div>
	</div>

	<!-- Conteúdo principal -->
	<main class="layout_centralizado">

	<!-- Resumo -->
	<section class="card card_resumo_final">
		<img src="img/logo.jpg" class="img_festa_resumo" alt="Imagem da Festa">
		
		<h1 class="titulo_sucesso">Festa Configurada sem Conflitos!</h1>
		
		<div class="caixa_informacoes_finais">
			<span class="texto_cinza_escuro texto_medio">Local: Espaço Jardim da Barra (Barra da Tijuca)</span>
			<div class="linha_valor_total">
				<span class="texto_preto_negrito texto_grande">Valor Total: R$ 2500,00</span>
			</div>
		</div>

		<a href="Confirmacao.html" class="btn_finalizar">
			FINALIZAR
		</a>

		<a href="Evento.html" class="link_voltar" style="text-decoration: none;">
			<img src="img/setinha.png" width="16px" height="16px"   alt="Voltar">
			<span class="texto_cinza">Voltar</span>
		</a>
	</section>

</main>
</div>
<!-- Rodapé -->
<footer>
	<span class="text-footer"> © 2026 Let’s Party. Todos os direitos reservados. </span>
</footer>

	<script src="style.js"></script>

</body>
</html>
